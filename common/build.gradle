dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    api 'org.slf4j:slf4j-api:2.0.16'

    // Zstandard is referenced reflectively by the codec, so it is not a compile dependency. It is
    // present at test runtime so the Zstandard path is exercised for real; the server distribution
    // bundles the jar itself and the client never carries it.
    testRuntimeOnly 'com.github.luben:zstd-jni:1.5.6-4'
}
